[project]
name = "adacast-lite-ml"
version = "0.3.0"
description = "Independent forecasting computation and evaluation for adacast-lite"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "pandas==2.3.2", "scikit-learn==1.7.2", "scipy==1.15.3", "statsmodels==0.14.5", "matplotlib==3.10.6", "einops>=0.8", "tqdm>=4.66", "packaging>=24"]

[project.optional-dependencies]
statistical = ["statsmodels>=0.14,<0.15"]
neural = ["torch==2.9.1", "torchvision==0.24.1"]
foundation = ["chronos-forecasting>=2,<3", "torch==2.9.1", "transformers>=4.57,<5"]
timesfm = ["timesfm==3.0.2", "torch==2.9.1", "huggingface-hub"]
moirai = ["uni2ts>=2,<3", "gluonts", "lightning", "torch==2.9.1"]
tirex = ["tirex-ts[gluonts]>=1.4,<2", "torch==2.9.1"]
transformers-models = ["transformers>=4.57,<5", "torch==2.9.1", "huggingface-hub"]
mamba = ["mamba-ssm", "torch==2.9.1"]
reformer = ["reformer-pytorch", "torch==2.9.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adacast_lite_ml"]

[tool.uv]
# Retain the reference project's scientific-stack overrides for uni2ts.
override-dependencies = ["numpy==2.3.5", "scipy==1.15.3", "einops>=0.8", "torch==2.9.1"]
